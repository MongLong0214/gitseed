[project]
name = "gitseed"
version = "0.2.0"
description = "Triage GitHub repositories with a local model you have actually verified."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gitseed = "gitseed.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gitseed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
