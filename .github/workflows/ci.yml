name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commitlore:
    # Feature changes enter through dev and are validated there. A dev-to-main
    # release PR contains that already-validated history and must not re-lint it.
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate CommitLore records added by this pull request
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/commitlore"
          git clone https://github.com/MongLong0214/commitlore.git "$tool_dir"
          git -C "$tool_dir" checkout --detach 69ba58e1b8dc1f8f849e24e305cab2a004934e03
          node "$tool_dir/dist/commitlore.mjs" validate --range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set isolated HOME
        run: |
          mkdir -p "${{ runner.temp }}/gitseed-home"
          echo "HOME=${{ runner.temp }}/gitseed-home" >> "$GITHUB_ENV"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Run isolated test suite
        run: python -m pytest tests/ -q
      - name: Run fixture replay
        run: python -m gitseed run --query x --fixtures tests/fixtures
      - name: Compile package
        run: python -m compileall gitseed
      - name: Build distribution package
        run: python -m pip install "build>=1.0" && python -m build
      - name: Verify wheel contents
        run: |
          wheel_file=$(ls dist/*.whl | head -1)
          python -c "
          import zipfile
          import sys
          with zipfile.ZipFile('$wheel_file', 'r') as z:
              names = z.namelist()
              top_level = set(n.split('/')[0] for n in names)
              unwanted = {'assets', 'docs', 'scripts', 'tests'}
              found = unwanted & top_level
              if found:
                  print(f'ERROR: Found unwanted top-level packages: {found}', file=sys.stderr)
                  sys.exit(1)
              print(f'✓ Wheel contains only expected packages')
          "
      - name: Install built package and verify console script
        run: |
          pip install dist/*.whl
          gitseed --help
