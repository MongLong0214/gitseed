name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }

      - run: pip install pytest

      - name: Tests
        run: python -m pytest tests/ -q

      # The screen owns the malicious verdict, so it must not reach the network,
      # spawn anything, or consult a model. An import is the cheapest way for
      # that to stop being true, so it is checked rather than trusted.
      - name: The screen stays pure
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          src = pathlib.Path("gitseed/screen/signals.py").read_text()
          bad = {"urllib", "requests", "httpx", "socket", "subprocess", "os"}
          got = set()
          for n in ast.walk(ast.parse(src)):
              if isinstance(n, ast.Import):
                  got |= {a.name.split(".")[0] for a in n.names}
              elif isinstance(n, ast.ImportFrom) and n.module and n.level == 0:
                  got.add(n.module.split(".")[0])
          if got & bad:
              sys.exit(f"screen reached outside: {sorted(got & bad)}")
          print("pure")
          PY

      # Records are the point of this project's own history, so the history is
      # checked the way the protocol says to check it.
      - name: Commit records validate
        run: |
          git clone --quiet --depth 1 https://github.com/MongLong0214/commitlore /tmp/commitlore
          node /tmp/commitlore/dist/commitlore.mjs validate --range HEAD~1..HEAD || \
            node /tmp/commitlore/dist/commitlore.mjs validate --commit HEAD
