name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commitlore:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CommitLore records added by this pull request
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/commitlore"
          git clone https://github.com/MongLong0214/commitlore.git "$tool_dir"
          git -C "$tool_dir" checkout --detach 69ba58e1b8dc1f8f849e24e305cab2a004934e03
          node "$tool_dir/missing/commitlore.mjs" validate --range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set isolated HOME
        run: |
          mkdir -p "${{ runner.temp }}/gitseed-home"
          echo "HOME=${{ runner.temp }}/gitseed-home" >> "$GITHUB_ENV"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Run isolated test suite
        run: python -m pytest tests/ -q
      - name: Run fixture replay
        run: python -m gitseed run --query x --fixtures tests/fixtures
      - name: Compile package
        run: python -m compileall gitseed
