name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    env:
      HOME: ${{ runner.temp }}/gitseed-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create empty home directory
        run: mkdir -p "$HOME"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Run isolated test suite
        run: python -m pytest tests/ -q
      - name: Run fixture replay
        run: python -m gitseed run --query x --fixtures tests/fixtures
      - name: Compile package
        run: python -m compileall gitseed
