name: Phase Gate

# Runs `phase-gate.py` from the repo-factory skill against this repo's live
# GitHub state and fails the build when a phase's conditions are not met.
#
# The script itself has always exited non-zero on failure; the gap this
# workflow closes is that it previously could not run anywhere but the
# operator's own machine (`~/.claude/skills/repo-factory/scripts/`), which no
# CI runner can reach. See github.com/MongLong0214/repo-factory-gate for the
# published, pinned copy this workflow fetches, and that repo's README for
# why it is fetched by commit SHA + sha256 rather than vendored here.
#
# Trigger design (deliberately not "every push"): Phase 5's own conditions —
# zero open non-Backlog issues — are false for most of an active wave by
# construction (planned work sits open until closed), so gating it on every
# commit to `dev` would keep this repo's CI red through ordinary,
# unremarkable development and train reviewers to ignore it — the exact
# "brittle gate" failure phase-gate.py's own `github_checks()` was written to
# avoid. Phase 4 and 5 are therefore on-demand (`workflow_dispatch`), asked at
# the moment someone actually wants the phase-completion answer, exactly as
# `references/self-improvement-loop.md` describes using the gate. Phase 6
# (ship) is different: once its conditions are met they stay met (the tag
# stays reachable from `main`/`dev`, CI at that commit does not un-succeed),
# so it is safe — and useful — to also run automatically on every release tag
# push and on every PR into `dev` (a cheap, non-brittle continuous check that
# the shipped release stays intact).

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      phase:
        description: "repo-factory phase to check (4 = repo genesis, 5 = wave execution, 6 = ship)"
        required: true
        type: choice
        options:
          - "4"
          - "5"
          - "6"
        default: "5"
      release_tag:
        description: "Phase 6 only — override which release tag to check (default: latest annotated vX.Y.Z reachable from main)"
        required: false
        type: string

permissions:
  contents: read
  issues: read
  actions: read

env:
  GATE_MIRROR_REPO: MongLong0214/repo-factory-gate
  # Pin by commit SHA, not a branch — bump both together via
  # `~/.claude/skills/repo-factory/scripts/publish-gate.sh`, never by editing
  # just one.
  GATE_SHA: b98ffa3e144c02b17a1da73c84c5fe1b07e3eef1
  GATE_SHA256: bc8987b63fc7a2111e18fb4d08e69bb96083f677e604be2d5c2a316d3bc7a397
  # CommitLore commit used to install the Phase-4-only `validate` check
  # (invariant 12, "no silent skip"). Any commit works as long as it has the
  # reference/shape distinction (present since CommitLore's `572f573`); this
  # one is `dev` HEAD at the time this workflow was added.
  COMMITLORE_PIN: d862dc3292bfdd879cc235f0a5ecd9df1c67f9d0

jobs:
  phase-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine which phase to check
        id: which
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "phase=${{ inputs.phase }}" >> "$GITHUB_OUTPUT"
          else
            # Tag push (v*.*.*) or a PR into dev: both automatically run the
            # Phase 6 (ship) gate — the only phase safe to run unconditionally.
            echo "phase=6" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch phase-gate.py (pinned commit SHA, verified by sha256)
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GATE_MIRROR_REPO}/${GATE_SHA}/phase-gate.py" -o phase-gate.py
          echo "${GATE_SHA256}  phase-gate.py" | sha256sum -c -

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.which.outputs.phase == '4'
        with:
          node-version: 22

      - name: "Phase 4 only: install CommitLore so invariant 12 has something real to check"
        if: steps.which.outputs.phase == '4'
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/commitlore"
          git clone --quiet https://github.com/MongLong0214/commitlore.git "$tool_dir"
          git -C "$tool_dir" checkout --quiet --detach "$COMMITLORE_PIN"
          test -f "$tool_dir/dist/commitlore.mjs" || { echo "::error::commitlore dist/commitlore.mjs missing at pinned commit"; exit 1; }
          git config --local commitlore.bin "$tool_dir/dist/commitlore.mjs"
          git config --local commitlore.node "$(command -v node)"

      - name: "Phase gate — fails the build (nonzero exit) when the phase's conditions are not met"
        env:
          # gh needs a token to answer branch/milestone/issue/tag/CI-run
          # questions. If this were absent, phase-gate.py does not skip those
          # checks — `github_checks()` / `_gh_unavailable_reason()` report each
          # of them as an explicit FAIL ("gh CLI 인증 실패"), so a
          # misconfigured runner shows up as a red build, not a quiet pass.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          phase="${{ steps.which.outputs.phase }}"
          cmd=(python3 phase-gate.py "$phase" --repo "${{ github.repository }}" --path "$PWD")
          release_tag="${{ inputs.release_tag }}"
          if [ "$phase" = "6" ] && [ -n "$release_tag" ]; then
            cmd+=(--release-tag "$release_tag")
          fi
          "${cmd[@]}"
